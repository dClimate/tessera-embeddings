[project]
name = "tessera_embeddings"
version = "0.1.0"
description = "Distributed satellite data ingestion and Tessera embedding generation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Evan Schechter", email = "evan@arbol.io" },
    { name = "Robert Banick", email = "robert.banick@arbol.io" },
]
keywords = ["satellite", "remote-sensing", "embeddings", "tessera", "sentinel"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Base install: the ingestion pipeline (Sentinel-2/S1 ingest, Zarr store
# management). No torch, no Ray. Add [inference] to unlock Tessera embedding
# generation — that is what this library is for. The split is practical:
# torch is large and CUDA variants are platform-specific.
dependencies = [
    "xarray",
    "dask",
    "distributed",
    "zarr",
    "icechunk>=2.1.1",
    "fsspec",
    # Bounded because `ingest/stac.py` subclasses `odc.stac._mdtools.StacMDParser` and
    # `odc.loader.RioReader` to remove the Sentinel-2 BOA offset per image as it is read.
    # The first is private and the second's `read` contract is what the subclass overrides,
    # so a minor bump can move either without a deprecation. See
    # context_docs/decisions/021-correct-the-boa-offset-per-image.md.
    "odc-stac>=0.5.2,<0.6",
    "odc-geo",
    "rasterio",
    "rioxarray",
    "pystac",
    "pystac-client",
    "stackstac",
    "mgrs",
    "pyproj",
    "shapely",
    "pydantic",
    "pydantic-settings",
    "tenacity",
    "numcodecs[pcodec]",
    # The published registry is a Parquet dataset (see BucketPaths.optical_registry and the Open
    # Data access request): one part per cell as it lands, compacted later. Written from the fill,
    # so it is a runtime dependency rather than a dev one.
    "pyarrow",
    "cloudpickle",
    "tqdm",
    "pyyaml",
    "python-dotenv",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
inference = [
    "torch",
    "ray[default]",
    "scikit-learn",
    # fsspec's HTTP backend (used to pull model checkpoints from URLs such as
    # HuggingFace `resolve/main` links) requires aiohttp; it isn't pulled in by
    # fsspec itself. Already resolved in uv.lock.
    "aiohttp",
]
prefect = [
    "prefect>=3.0",
    "prefect-dask",
]
# prefect-aws lives here, not in `prefect`, so a Prefect user on GCP
# isn't forced to pull AWS-specific Prefect blocks.
aws = [
    "boto3",
    "botocore",
    "s3fs",
    "dask-cloudprovider[aws]",
    "prefect-aws",
    # Serves the Dask scheduler dashboard (port-forwarded over SSM).
    "bokeh",
    # Imported at module scope by providers/aws/dask.py (the scheduler health
    # plugin). It arrives transitively via distributed, but the import is ours,
    # so declare it rather than rely on a dependency's dependency.
    "psutil",
]
all = [
    "tessera_embeddings[inference,prefect,aws]",
]
# Pure-stdlib package exposing the architecture-test runner so downstream
# repos can enforce the same layer rules without pulling pytest.
architecture-tests = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-cov",
    "ruff",
    "mypy",
    "moto[server]",
    "hypothesis",
    "vcrpy",
    "pytest-recording",
    # Empty-store tests build grids from explicit affine transforms. affine
    # arrives transitively via odc-geo, but the tests import it directly, so
    # declare it.
    "affine",
]
# Standalone scale-test benchmarks under scripts/scale_tests/ (NOT pytest).
# Kept out of the package deps: only needed to *run* the scale campaign.
scale-tests = [
    "psutil",  # RSS sampling for commit-memory metrics
    "boto3",  # T7 raw-PUT ramp + S3 results mirror
    "s3fs",  # fsspec S3 backend for object_stats / store I/O on --backend s3
]

[tool.uv.sources]
# Default torch pin is CPU so laptop sync works without flags.
# CUDA variants override with --extra-index-url at lock time.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Operator profiling commands (tessera_embeddings.profiling). Each binds to an
# existing `main(argv) -> int`; every one is equally runnable as
# `python -m tessera_embeddings.profiling.<stage>.<tool>`, which is what a
# checkout uses. The te-* prefix keeps them namespaced on a shared PATH.
# The three AWS-facing ones (watch-scheduler, ingest-log-queries,
# observe-cluster) need the `aws` extra for boto3.
[project.scripts]
te-watch-scheduler = "tessera_embeddings.profiling.ingest.watch_scheduler:main"
te-ingest-log-queries = "tessera_embeddings.profiling.ingest.ingest_log_queries:main"
te-ingest-report = "tessera_embeddings.profiling.ingest.report:main"
te-observe-cluster = "tessera_embeddings.profiling.inference.observe_cluster:main"
te-compare-outputs = "tessera_embeddings.profiling.inference.compare_outputs:main"
te-compare-stores = "tessera_embeddings.profiling.inference.compare_coarsened_stores:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera_embeddings"]

[tool.pytest.ini_options]
# Default invocation excludes integration / parity / slow / gpu;
# CI workflows target those explicitly.
addopts = "-m 'not integration and not parity and not slow and not gpu'"
markers = [
    "integration: requires network/AWS/external services",
    "parity: Prefect vs plain.py output equivalence (slow)",
    "slow: >30s runtime (CPU inference, etc.)",
    "gpu: requires CUDA",
]
testpaths = ["tests"]
