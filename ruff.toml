line-length = 120
target-version = "py312"
force-exclude = true

exclude = [
    ".git",
    ".venv",
    "venv",
    ".env",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
    "open_sourcing_planning",
]

[format]
quote-style = "double"
indent-style = "space"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "T20",  # flake8-print
    "PTH",  # flake8-use-pathlib
    "ARG",  # flake8-unused-arguments
    "ANN",  # flake8-annotations
]

extend-select = ["E501"]

ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D107",   # Missing docstring in __init__
    "D205",
    "SIM105", # exception-handling style
    "SIM108", # ternary-style suggestion
]

[lint.isort]
known-first-party = ["tessera_embeddings"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG", "RUF059", "F841", "D102", "D103", "N803", "N806", "C408"]
"examples/**/*.py" = ["T201"]
"scripts/**/*.py" = ["T201"]
# Scale-test benchmarks use conventional short module aliases (V=variants,
# SB=store_builder) that read well across these many-call scripts.
"scripts/scale_tests/**/*.py" = ["N812"]
"src/tessera_embeddings/architecture_tests/**/*.py" = ["T201"]
