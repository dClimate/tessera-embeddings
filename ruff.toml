line-length = 120
target-version = "py312"
force-exclude = true

exclude = [
    ".git",
    ".venv",
    "venv",
    ".env",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    # ANCHORED. A bare "build" matches any directory of that name at any depth, which silently
    # excluded `scripts/build/` — two scripts, and anything later added beside them, were neither
    # linted nor formatted, and nothing said so. Only the build artifact directory at the project
    # root is meant here.
    "/build",
    "dist",
    "*.egg-info",
    "open_sourcing_planning",
    # Verbatim upstream sources vendored as golden references for port tests.
    # They must stay byte-comparable to the files they were copied from, so
    # neither the linter nor the formatter may touch them.
    "tests/fixtures/upstream",
]

[format]
quote-style = "double"
indent-style = "space"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "T20",  # flake8-print
    "PTH",  # flake8-use-pathlib
    "ARG",  # flake8-unused-arguments
    "ANN",  # flake8-annotations
]

# A miscounted %-placeholder raises inside logging, which swallows it and drops the line —
# on a Dask worker, where the dropped line was the only record that the task ran. This was
# checked by a hand-rolled AST walk in tests/unit/ingest/test_source_read_resilience.py that read
# ONE module (ingest/s1_roi.py); these rules make the same check over ALL OF src/ AND tests/,
# which is strictly wider. Verified equivalent before that test was removed: a too-many and a
# too-few mutant in s1_roi.py each fail these rules exactly as they failed the test.
#
# Scope caveat: lint.yml runs `ruff check src/ tests/`, so scripts/ is NOT covered in CI even
# though these rules would apply to it — roughly ten scale-test scripts use %-style logging.
# scripts/ passes the whole rule set as it stands (checked 2026-08-25), and the per-file
# ignores below already anticipate it being linted, so adding it to lint.yml would be green
# today. That is a CI-scope decision rather than part of the test-suite work, so it is left.
extend-select = ["E501", "PLE1205", "PLE1206", "TID251", "C901"]

ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D107",   # Missing docstring in __init__
    "D205",
    "SIM105", # exception-handling style
    "SIM108", # ternary-style suggestion
]

# Architecture rules about NAMES, which import-linter cannot express because it sees a
# third-party package only as its top-level module (see .importlinter). Each ban covers
# `from x import name` and `module.name(...)` alike, relative imports included. A legitimate
# use carries an inline `# noqa: TID251` saying why, never a per-file ignore, which would
# lift every ban in the file at once.
[lint.flake8-tidy-imports.banned-api]
# Clients are fetched once by a Prefect task shell and passed down; domain code never
# summons one from context.
"dask.distributed.get_client".msg = "Take the Dask client as a parameter; only Prefect task shells fetch it."
"distributed.get_client".msg = "Take the Dask client as a parameter; only Prefect task shells fetch it."
"distributed.client.get_client".msg = "Take the Dask client as a parameter; only Prefect task shells fetch it."
"distributed.worker.get_client".msg = "Take the Dask client as a parameter; only Prefect task shells fetch it."
# The UTC-to-solar offset is applied exactly once, at the catalogue chokepoint, by
# normalize_to_solar_day. A second application shifts an already-shifted timestamp; a
# per-site application drifted before (src/tessera_embeddings/ingest/README.md).
"tessera_embeddings.ingest.solar_days.solar_day_offset_seconds".msg = "Use solar_days.normalize_to_solar_day; the offset is applied only there."

# Per-function McCabe complexity, gated so a NEW function stays small enough to review: a
# change that would push one past this is the cue to split it. The functions already past it
# carry `# noqa: C901` (grandfathered, mostly flow and runner entry points); an edit that
# grows one should still prefer extracting a helper. Rationale: ADR 040.
[lint.mccabe]
max-complexity = 15

[lint.isort]
known-first-party = ["tessera_embeddings"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Tests exercise the banned names directly (TID251): the bans constrain library code only.
"tests/**/*.py" = ["TID251", "ANN", "ARG", "RUF059", "F841", "D102", "D103", "N803", "N806", "C408"]
"examples/**/*.py" = ["T201"]
"scripts/**/*.py" = ["T201"]
# Scale-test benchmarks use conventional short module aliases (V=variants,
# SB=store_builder) that read well across these many-call scripts.
"scripts/scale_tests/**/*.py" = ["N812"]
# Operator CLIs that live in the package so they can ship as console scripts.
# Printing IS their output contract: the profiling tools emit JSON on stdout
# for an agent to consume plus a human view on stderr, so T201 doesn't apply.
"src/tessera_embeddings/profiling/**/*.py" = ["T201"]
# A diagnostic that reports how the world's UTM zones divide across N Ray
# clusters. Printing IS its output contract, same as the tools above — it lives
# in tests/ rather than profiling/ because it drives the real partitioner, which
# is inside the Prefect layer and so cannot be imported from the package.
# Matched by basename: keyed to a full path, this silently stopped applying when
# the file moved into a subject directory, and the print calls became lint errors.
"**/test_cluster_balance.py" = ["T201"]
