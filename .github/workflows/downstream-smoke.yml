name: Downstream smoke test

# DISABLED BY DEFAULT. This is a starting point for running a dependent project's fast
# test suite against a pull request here, so a breaking change is caught at the point of
# change rather than after a release.
#
# To adopt it:
#
#   1. Set a repository variable `DOWNSTREAM_REPO` to the project to test, as
#      `owner/name`. It is a variable rather than a literal so that a fork can point
#      this at its own project without editing the workflow.
#   2. Add a repository secret `DOWNSTREAM_READ_TOKEN` — a read-only token with access
#      to that project. Omit it if the project is public.
#   3. Adjust the lock-file name and the test command in the last two steps to whatever
#      that project uses. The ones below assume a `dev.lock` and a
#      `tests/unit tests/architecture` split, which is this repository's own convention.
#   4. Uncomment the `pull_request` trigger.
#
# Confirm the other project's default branch has a reliably green run of that command
# before enabling the trigger: a suite that is already red reports nothing useful.
#
# This workflow MUST NEVER be a required status check. A project that the people
# reviewing a pull request here cannot see should not be able to veto a release. The
# `continue-on-error: true` below makes a failure surface as a warning, not a block.
on:
  # pull_request:
  #   branches: [main]
  workflow_dispatch: {}  # manual-only trigger while disabled

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # informational only
    steps:
      - name: Check out the dependent project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.DOWNSTREAM_REPO }}
          ref: main
          token: ${{ secrets.DOWNSTREAM_READ_TOKEN }}
          path: downstream
      - name: Check out this pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tessera_embeddings
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: "downstream/dev.lock"
      - name: Install the dependent project against this pull request's tessera_embeddings
        run: |
          cd downstream
          uv pip install -r dev.lock
          # Override the pinned tessera_embeddings with the checkout above. This must come
          # AFTER the lock file, or the lock reinstalls the pinned release over it and the
          # suite tests the last release instead of this pull request.
          uv pip install ../tessera_embeddings
      - name: Run the dependent project's fast suite
        run: |
          cd downstream
          uv run pytest tests/unit tests/architecture -n auto --tb=short
