name: Release

on:
  push:
    tags:
      - 'v*'   # any tag starting with v (e.g. v0.1.0, v1.2.3)

# Publishes to PyPI via Trusted Publishing (OIDC). Configure the PyPI
# project at https://pypi.org/manage/project/.../settings/publishing/
# to accept this repository + workflow + environment.
jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi  # gates the deploy with the "pypi" GitHub environment
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "dev.lock"
      - name: Build sdist + wheel
        run: uv build
      - name: Publish to PyPI
        # No API token needed — trusted publishing reads the OIDC claim
        # and matches it against the PyPI project's allowed publishers.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
