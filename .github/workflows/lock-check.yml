name: Lock file check

on:
  pull_request:
    branches: [main]
    # Only run when pyproject.toml or one of the lock files changes —
    # those are the only edits that can drift the locks.
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'lock/inference-cpu.lock'
      - 'lock/inference-cu121.lock'
      - 'lock/dev.lock'
      - 'lock/lock.sh'

# Catches the "edited pyproject.toml without regenerating locks" mistake.
# Keep this workflow cheap — it's a defensive check; if it gets slow,
# people start ignoring it.
jobs:
  verify-locks-regenerated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "lock/dev.lock"
      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Check pip-compile lock files are up to date
        # Regenerate into tmp files and diff; exits nonzero if any file
        # would change. uv lock --check handles uv.lock above.
        run: |
          uv pip compile pyproject.toml \
              --extra inference --extra prefect --extra aws \
              --universal --no-strip-extras \
              -o /tmp/inference-cpu.lock
          uv pip compile pyproject.toml \
              --extra inference --extra prefect --extra aws \
              --python-platform linux \
              --python-version 3.12 \
              --extra-index-url https://download.pytorch.org/whl/cu121 \
              --index-strategy unsafe-best-match \
              --no-strip-extras \
              -o /tmp/inference-cu121.lock
          uv pip compile pyproject.toml \
              --extra inference --extra prefect --extra aws --group dev \
              --universal --no-strip-extras \
              -o /tmp/dev.lock
          changed=0
          diff lock/inference-cpu.lock /tmp/inference-cpu.lock || changed=1
          diff lock/inference-cu121.lock /tmp/inference-cu121.lock || changed=1
          diff lock/dev.lock /tmp/dev.lock || changed=1
          if [ "$changed" -ne 0 ]; then
            echo "::error::Lock files are out of date. Run lock/lock.sh and commit."
            exit 1
          fi
