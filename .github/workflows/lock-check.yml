name: Lock file check

on:
  pull_request:
    branches: [main]
    # Only run when pyproject.toml or one of the lock files changes —
    # those are the only edits that can drift the locks.
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'inference-cpu.lock'
      - 'inference-cu121.lock'
      - 'dev.lock'
      - 'scripts/lock.sh'

# Catches the "edited pyproject.toml without regenerating locks" mistake.
# Keep this workflow cheap — it's a defensive check; if it gets slow,
# people start ignoring it.
jobs:
  verify-locks-regenerated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "dev.lock"
      - name: Re-run lock.sh and verify no diff
        run: |
          bash scripts/lock.sh
          if ! git diff --exit-code uv.lock inference-cpu.lock inference-cu121.lock dev.lock; then
            echo "::error::pyproject.toml changed but lock files were not regenerated."
            echo "::error::Run scripts/lock.sh and commit the result."
            exit 1
          fi
