name: Integration + Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/tessera_embeddings/ingest/**'
      - 'src/tessera_embeddings/inference/**'
      - 'src/tessera_embeddings/orchestration/**'
      - 'src/tessera_embeddings/providers/**'
      - 'src/tessera_embeddings/storage/**'
      - 'tests/integration/**'
      - 'tests/parity/**'
      - 'tests/fixtures/**'
      - 'pyproject.toml'
      - 'uv.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "uv.lock"
          prune-cache: true

      - name: Install dependencies
        run: uv sync --python 3.13 --all-extras

      - name: Run integration tests
        run: uv run pytest tests/integration -m integration -n auto -v --tb=short

  parity-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: "uv.lock"
          prune-cache: true

      - name: Install dependencies
        run: uv sync --python 3.13 --all-extras

      - name: Run parity tests (excluding slow)
        run: uv run pytest tests/parity -m "parity and not slow" -v --tb=short
