name: Integration + Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/tessera_embeddings/ingest/**'
      - 'src/tessera_embeddings/inference/**'
      - 'src/tessera_embeddings/orchestration/**'
      - 'src/tessera_embeddings/providers/**'
      - 'src/tessera_embeddings/storage/**'
      - 'tests/integration/**'
      - 'tests/parity/**'
      - 'tests/fixtures/**'
      - 'pyproject.toml'
      - 'lock/dev.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.13.0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-dependency-glob: "lock/dev.lock"

      - name: Install dependencies
        run: |
          uv venv --python 3.13 --clear .venv
          uv pip install --python .venv/bin/python \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r lock/dev.lock
          uv pip install --python .venv/bin/python --no-deps -e .

      - name: Run integration tests
        run: .venv/bin/pytest tests/integration -m integration -n auto -v --tb=short

  parity-fast:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.13.0
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-dependency-glob: "lock/dev.lock"

      - name: Install dependencies
        run: |
          uv venv --python 3.13 --clear .venv
          uv pip install --python .venv/bin/python \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r lock/dev.lock
          uv pip install --python .venv/bin/python --no-deps -e .

      - name: Run parity tests (excluding slow)
        run: .venv/bin/pytest tests/parity -m "parity and not slow" -v --tb=short
