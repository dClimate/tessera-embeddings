name: Integration + Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/tessera_embeddings/ingest/**'
      - 'src/tessera_embeddings/inference/**'
      - 'src/tessera_embeddings/orchestration/**'
      - 'src/tessera_embeddings/providers/**'
      - 'src/tessera_embeddings/storage/**'
      - 'tests/integration/**'
      - 'tests/parity/**'
      - 'tests/fixtures/**'
      - 'pyproject.toml'
      - 'dev.lock'

jobs:
  integration:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.13.0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        run: |
          apt-get update -qq
          apt-get install -y -qq curl
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache venv
        id: cache-venv
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .venv
          key: v2-venv-gdal3.13.0-py3.13-${{ hashFiles('dev.lock') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          GDAL_VERSION=$(gdal-config --version)
          uv venv --python 3.13 .venv
          grep -v '^gdal==' dev.lock | uv pip install --python .venv/bin/python \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r /dev/stdin
          uv pip install --python .venv/bin/python "gdal==${GDAL_VERSION}"
          uv pip install --python .venv/bin/python -e .

      - name: Run integration tests
        run: .venv/bin/pytest tests/integration -m integration -n auto -v --tb=short

  parity-fast:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.13.0
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        run: |
          apt-get update -qq
          apt-get install -y -qq curl
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache venv
        id: cache-venv
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .venv
          key: v2-venv-gdal3.13.0-py3.13-${{ hashFiles('dev.lock') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          GDAL_VERSION=$(gdal-config --version)
          uv venv --python 3.13 .venv
          grep -v '^gdal==' dev.lock | uv pip install --python .venv/bin/python \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r /dev/stdin
          uv pip install --python .venv/bin/python "gdal==${GDAL_VERSION}"
          uv pip install --python .venv/bin/python -e .

      - name: Run parity tests (excluding slow)
        run: .venv/bin/pytest tests/parity -m "parity and not slow" -v --tb=short
