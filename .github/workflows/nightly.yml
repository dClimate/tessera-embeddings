name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  slow-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system GDAL
        id: gdal-version
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libgdal-dev
          echo "version=$(gdal-config --version)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Cache venv
        id: cache-venv
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .venv
          key: venv-gdal${{ steps.gdal-version.outputs.version }}-py3.13-${{ hashFiles('dev.lock') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          GDAL_VERSION=$(gdal-config --version)
          uv venv .venv
          grep -v '^gdal==' dev.lock | uv pip install --python .venv/bin/python \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r /dev/stdin
          uv pip install --python .venv/bin/python "gdal==${GDAL_VERSION}"

      - name: Run slow parity tests
        run: .venv/bin/pytest tests/parity -m "parity and slow" -v --tb=short
      - name: Run slow tests
        run: .venv/bin/pytest tests/slow -m slow -v --tb=short
