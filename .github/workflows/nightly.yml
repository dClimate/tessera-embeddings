name: Nightly

# SCHEDULE SUSPENDED 2026-08-25. The selector below matches exactly one test —
# tests/parity/test_full_pipeline_parity.py — whose body is `raise NotImplementedError`
# under `@pytest.mark.xfail(strict=True)`. The wiring is correct; the test it points at
# has not been written yet, so a daily 120-minute runner was confirming a placeholder is
# still a placeholder. Restore the `schedule:` block below when that test is real.
# See tests/README.md "Roadmap" and context_docs/test-suite-streamlining.md §2.3.
on:
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  slow-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: "uv.lock"
          prune-cache: true

      - name: Install dependencies
        run: uv sync --python 3.13 --all-extras

      - name: Run slow parity tests
        run: uv run pytest tests/parity -m "parity and slow" -v --tb=short
