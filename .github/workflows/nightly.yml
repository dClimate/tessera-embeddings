name: Nightly

on:
  schedule:
    # 06:00 UTC daily (~01:00 ET / 22:00 PT). Off-peak so any late-running
    # job finishes before the morning developer surge.
    - cron: '0 6 * * *'
  workflow_dispatch: {}  # manual trigger from the GitHub Actions UI

# The nightly suite covers the slow parity + slow unit tests that are
# excluded from the per-PR gate. Wall-clock-insensitive (nobody waits).
jobs:
  slow-parity:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.13.0
    # Default 2-core runner is intentional: this job is wall-clock-
    # insensitive and we'd rather spend fewer Actions minutes than shave
    # 30% off a 60-min run.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Cache venv
        id: cache-venv
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .venv
          key: venv-gdal3.13.0-py3.13-${{ hashFiles('dev.lock') }}
      - name: Install C build tools
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: apt-get update -qq && apt-get install -y -qq build-essential python3-dev
      - name: Install dev environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: uv sync --frozen --group dev
      - name: Run slow parity tests
        # Serial — each parity test is already a heavyweight pipeline-pair.
        run: uv run pytest tests/parity -m "parity and slow" -v --tb=short
      - name: Run slow tests
        run: uv run pytest tests/slow -m slow -v --tb=short
