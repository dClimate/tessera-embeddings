name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  slow-parity:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.13.0
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build tools + uv
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential curl
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache venv + uv Python
        id: cache-venv
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .venv
            ~/.local/share/uv/python
          key: v4-venv-gdal3.13.0-py3.13-${{ hashFiles('dev.lock') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          GDAL_VERSION=$(gdal-config --version)
          uv venv --python 3.13 .venv
          grep -v '^gdal==' dev.lock | uv pip install --python .venv/bin/python \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r /dev/stdin
          uv pip install --python .venv/bin/python "gdal==${GDAL_VERSION}"
          uv pip install --python .venv/bin/python -e .

      - name: Run slow parity tests
        run: .venv/bin/pytest tests/parity -m "parity and slow" -v --tb=short
      - name: Run slow tests
        run: .venv/bin/pytest tests/slow -m slow -v --tb=short
