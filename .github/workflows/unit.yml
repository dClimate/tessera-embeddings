name: Unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# gdal is a C extension that must be built against matching headers.
# We run inside the osgeo/gdal container so the system GDAL version
# is fixed (3.13.0) and gdal-config is always present. The install
# two-step:
#   1. Install everything in lock/dev.lock *except* gdal
#   2. Install gdal pinned to the container library version
# keeps the Python binding and libgdal in lockstep.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.13.0
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12: declared floor in pyproject.toml.
        # 3.13: current stable (developed against this).
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential curl git gpg

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-dependency-glob: "lock/dev.lock"

      - name: Install dependencies
        run: |
          GDAL_VERSION=$(gdal-config --version)
          uv venv --python ${{ matrix.python-version }} --clear .venv
          grep -v '^gdal==' lock/dev.lock | uv pip install --python .venv/bin/python \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r /dev/stdin
          uv pip install --python .venv/bin/python "gdal==${GDAL_VERSION}"
          uv pip install --python .venv/bin/python -e .

      - name: Run unit tests with coverage
        run: |
          .venv/bin/pytest tests/unit \
            -n auto \
            --cov=src/tessera_embeddings \
            --cov-report=xml \
            --tb=short

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@3f20e214133d0983f9a10f3d63b0faf9241a3daa # v6.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
