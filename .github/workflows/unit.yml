name: Unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # THIS LIST AND THE `Programming Language :: Python :: 3.x` CLASSIFIERS IN
        # pyproject.toml MUST MATCH. They are the same claim in two files: the classifiers
        # advertise a version, this matrix is the only thing that substantiates it. 3.14 was
        # advertised and never tested here, so the classifier was dropped.
        #
        # Adding 3.14 back is cheap and does NOT depend on CUDA: this job syncs WITHOUT
        # `--no-sources`, so `[tool.uv.sources] torch = { index = "pytorch-cpu" }` applies and
        # the run is CPU-only. The committed lock already resolves for 3.14 -- its torch entry
        # carries `python_full_version == '3.14.*'` markers -- and `uv sync --python 3.14
        # --all-extras --frozen` resolves 237 packages with torch 2.12.0 from the CPU registry.
        # The GPU wheel gap on 3.14 is a SEPARATE constraint (docs/environment-setup.md) and is
        # not a reason to keep this matrix narrow. Add the entry and the classifier together.
        #   3.12: declared floor in pyproject.toml (`requires-python`).
        #   3.13: current stable, and what every other workflow pins.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-dependency-glob: "uv.lock"
          prune-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras

      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/unit \
            -n auto \
            --cov=src/tessera_embeddings \
            --cov-report=xml \
            --tb=short

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
