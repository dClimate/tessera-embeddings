name: Unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# gdal is a C extension that must be built against matching headers.
# We run inside the osgeo/gdal container so the system GDAL version
# is fixed (3.13.0) and gdal-config is always present.  The install
# two-step:
#   1. Install everything in dev.lock *except* gdal
#   2. Install gdal pinned to the container library version
# keeps the Python binding and libgdal in lockstep.
#
# Cache includes both .venv and the uv-managed Python install
# (~/.local/share/uv/python) so that venv symlinks remain valid after
# a cache restore inside the container.
jobs:
  unit:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.13.0
    strategy:
      fail-fast: false
      matrix:
        # 3.12: declared floor in pyproject.toml.
        # 3.13: current stable (developed against this).
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install codecov deps
        # curl + git are required by codecov-action on every run.
        # build-essential is only needed when compiling the venv (cache miss);
        # it is installed inside the "Install dependencies" step below.
        run: |
          apt-get update -qq
          apt-get install -y -qq curl git gpg

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Cache venv + uv Python
        id: cache-venv
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .venv
            ~/.local/share/uv/python
          key: v4-venv-gdal3.13.0-py${{ matrix.python-version }}-${{ hashFiles('dev.lock') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          apt-get install -y -qq build-essential
          GDAL_VERSION=$(gdal-config --version)
          uv venv --python ${{ matrix.python-version }} .venv
          grep -v '^gdal==' dev.lock | uv pip install --python .venv/bin/python \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r /dev/stdin
          uv pip install --python .venv/bin/python "gdal==${GDAL_VERSION}"
          uv pip install --python .venv/bin/python -e .

      - name: Run unit tests with coverage
        run: |
          .venv/bin/pytest tests/unit \
            -n auto \
            --cov=src/tessera_embeddings \
            --cov-report=xml \
            --tb=short

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@3f20e214133d0983f9a10f3d63b0faf9241a3daa # v6.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
