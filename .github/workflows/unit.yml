name: Unit tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Third-party actions are pinned to commit SHAs. Dependabot
# (.github/dependabot.yml) bumps them weekly. Each comment notes the
# human-readable version that the SHA corresponds to.
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel sibling matrix legs on failure — a 3.14 regression
      # shouldn't hide whether 3.12 still passes, and vice versa.
      fail-fast: false
      matrix:
        # 3.12: declared floor in pyproject.toml (requires-python).
        # 3.13: current stable (the package is developed against this).
        # 3.14: newest stable — catch forward-compat breaks early
        #       (e.g. deprecated stdlib APIs, dep wheel availability).
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "dev.lock"
          # uv downloads + manages the Python interpreter itself; no
          # actions/setup-python step needed.
          python-version: ${{ matrix.python-version }}
      - name: Install dev environment
        run: uv sync --frozen --group dev
      - name: Run unit tests with coverage
        # `-n auto` parallelises across CPUs via pytest-xdist (in dev group).
        # Unit tests are function-level and independent — near-linear speedup.
        # See implementation plan §12.8 for xdist conventions.
        run: |
          uv run pytest tests/unit \
            -n auto \
            --cov=src/tessera_embeddings \
            --cov-report=xml \
            --tb=short
      - name: Upload coverage
        # Upload once per PR (from the floor version) to avoid duplicate reports.
        # 3.12 output is the canonical baseline.
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@3f20e214133d0983f9a10f3d63b0faf9241a3daa # v6.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
