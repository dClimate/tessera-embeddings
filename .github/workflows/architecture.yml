name: Architecture

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.13.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential curl git gpg

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --python 3.13 --all-extras

      - name: Run architecture tests
        run: uv run pytest tests/architecture -v
      - name: Run architecture-tests CLI directly
        run: uv run python -m tessera_embeddings.architecture_tests --source src/tessera_embeddings/
