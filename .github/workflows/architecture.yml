name: Architecture

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: "uv.lock"
          prune-cache: true

      - name: Install dependencies
        run: uv sync --python 3.13 --all-extras

      # The import contracts in .importlinter. The name bans (get_client, the solar-day
      # offset) are ruff TID251 rules and run in lint.yml with the rest of ruff.
      - name: Import contracts
        run: uv run lint-imports
      - name: Cassette safety
        run: uv run pytest tests/architecture -v
