name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs. Dependabot
      # (.github/dependabot.yml) bumps them weekly. Each comment notes
      # the human-readable version that the SHA corresponds to so PR
      # reviewers can sanity-check the bump without re-resolving SHAs.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "dev.lock"
      - name: Install dev environment
        run: uv sync --frozen --group dev
      - name: ruff check
        run: uv run ruff check src/ tests/
      - name: ruff format check
        run: uv run ruff format --check src/ tests/
      - name: mypy
        run: uv run mypy src/tessera_embeddings/
