name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.13.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-dependency-glob: "lock/dev.lock"

      - name: Install dependencies
        run: |
          GDAL_VERSION=$(gdal-config --version)
          uv venv --python 3.13 --clear .venv
          grep -v '^gdal==' lock/dev.lock | uv pip install --python .venv/bin/python \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r /dev/stdin
          uv pip install --python .venv/bin/python "gdal==${GDAL_VERSION}"
          uv pip install --python .venv/bin/python -e .

      - name: ruff check
        run: .venv/bin/ruff check src/ tests/
      - name: ruff format check
        run: .venv/bin/ruff format --check src/ tests/
      - name: mypy
        run: .venv/bin/mypy src/tessera_embeddings/
