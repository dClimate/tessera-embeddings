# Quickstart config for the orchestrator-free plain runner.
#
# Run with:
#     python -m tessera_embeddings.orchestration.runners.plain \
#         examples/quickstart/config.yaml --skip-inference
#
# Drop --skip-inference to run the full pipeline (CPU inference).
# Expect ~30+ minutes end-to-end on a developer laptop.
#
# All paths use file:// for portability. Replace with s3:// (or any
# fsspec-supported scheme) for cloud deployments.

paths:
  inputs: file:///tmp/tessera/inputs
  outputs: file:///tmp/tessera/outputs
  preprocessed: file:///tmp/tessera/preprocessed

roi:
  # 10 km box over Story County, IA (Ames) — top corn-producing county.
  # See examples/quickstart/README.md for why this AOI was chosen.
  name: quickstart_story_county_ia
  geojson: examples/quickstart/roi.geojson
  resolution: 10.0
  chunk_size: 2000
  # Story County, IA falls in UTM zone 15N. Rasterisation requires a
  # projected CRS (metres, not degrees); the GeoJSON itself is CRS84.
  force_crs: "EPSG:32615"

# Ingest date range. Keep narrow for quickstart speed; widen for
# realistic comparison against production.
time_range:
  start: "2024-07-01"
  end: "2024-08-01"

# Inference time window — must match a 12-month rolling window's end.
# (Plain runner derives this from the same string Prefect flows accept.)
time_window_end: "August 2024"

# Single-orbit ingest is enough for the quickstart.
s1_orbit: ascending

# Local Dask cluster size on the runner host.
n_workers: 2

# Optional override for the directory containing the model checkpoint.
# null means the runner looks under {inputs}/models/. Set this to keep
# checkpoints outside the inputs tree so they survive a data wipe.
# Example: checkpoint_dir: /tmp/tessera-models
checkpoint_dir: /tmp/tessera-models

# Device for inference. "auto" uses a GPU if torch.cuda.is_available(),
# otherwise falls back to CPU. Set to "cpu" or "cuda" to override.
device: auto

# fsspec storage options. null lets fsspec auto-detect; for s3:// you
# might pass {anon: false} or a dict with key/secret.
storage_options: null
