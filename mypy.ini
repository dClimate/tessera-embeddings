[mypy]
python_version = 3.12
warn_return_any = false
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = import-untyped
explicit_package_bases = true
mypy_path = src

[mypy-tests.*]
disallow_untyped_defs = false

[mypy-scripts.*]
ignore_errors = true

[mypy-yaml]
ignore_missing_imports = true

[mypy-requests.*]
ignore_missing_imports = true

[mypy-dask.*]
ignore_missing_imports = true

[mypy-xarray.*]
ignore_missing_imports = true

[mypy-rioxarray.*]
ignore_missing_imports = true

[mypy-odc.*]
ignore_missing_imports = true

[mypy-pystac_client.*]
ignore_missing_imports = true

[mypy-ray.*]
ignore_missing_imports = true

[mypy-stackstac.*]
ignore_missing_imports = true

[mypy-icechunk.*]
ignore_missing_imports = true

# zarr v3 stubs use wide union return types (Array | Group) that don't narrow
# cleanly in the inference loading code. Suppress until zarr ships better stubs
# or we add explicit isinstance guards.
[mypy-tessera_embeddings.inference.data_loading]
ignore_errors = true

[mypy-tessera_embeddings.inference.chunk_spec]
ignore_errors = true

# torch type stubs flag callable-Tensor patterns that are correct at runtime.
[mypy-tessera_embeddings.inference.models.modules]
ignore_errors = true

[mypy-tessera_embeddings.inference.models.builder]
ignore_errors = true
